# Hunter130 AMP model_50000: policy and YAML joint order are identical.
controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    default_controller:
      type: ec/DefaultController
    stand_controller:
      type: ec/StandController
    walk_controller:
      type: ec/WalkController
    mimic_controller:
      type: ec/MimicController
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
controller_switcher:
  ros__parameters:
    controller_manager_ns: /controller_manager
    controllers:
    - default_controller
    - stand_controller
    - walk_controller
    - mimic_controller
    always_on_controllers:
    - joint_state_broadcaster
    initial_controller: default_controller
    silence_reset_ms: 200
    allowed_transitions:
      default_controller:
      - stand_controller
      stand_controller:
      - walk_controller
      - mimic_controller
      - default_controller
      walk_controller:
      - mimic_controller
      - default_controller
      mimic_controller:
      - walk_controller
      - stand_controller
      - default_controller
